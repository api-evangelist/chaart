description: 'Chaart (주식회사 차트, Chaart Inc.) is a Seoul-based art-trading and art-asset-management
  platform for South Korea''s art collectors and investors. Its iOS and Android apps let collectors
  buy and resell artworks in the secondary market with transparent price/valuation information,
  automatic artwork matching, authenticity checks, secure delivery, and integrated payments. Chaart
  reports 5,000+ registered collectors and thousands of artworks traded, and raised pre-seed funding
  from 500 Global. Chaart is a consumer mobile app: as of this enrichment pass it publishes no public
  developer API, OpenAPI, SDKs, or developer portal.'
